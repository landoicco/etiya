# Weekly version updates for the API (Maven), the web app (npm), CI and the Docker images,
# grouped so each ecosystem opens one PR for minor and patch bumps.
# Major bumps arrive as their own PR, since they are the ones that can break something.
# Security updates are not grouped and do not wait for the schedule.
# flake.lock is not covered: the toolchain is updated by hand with `nix flake update`
version: 2

updates:
  - package-ecosystem: maven
    directories: ["/core", "/infra"]
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: "/core"
    schedule:
      interval: weekly
    ignore:
      # A major bump here is a new Java version, which has to move together with the Lambda
      # runtime in infra and the JDK in the flake
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # In "3.9-eclipse-temurin-21" Dependabot reads 3.9 (Maven) as the version and the Java
      # version as a suffix, so the rule above misses Java bumps: it once proposed Java 24.
      # The floating tag already picks up Maven 3.9 and Java 21 patches on every build
      - dependency-name: "maven"

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
