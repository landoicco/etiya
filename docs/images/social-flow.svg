<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c0a"/>
      <stop offset="100%" stop-color="#1d1713"/>
    </linearGradient>
    <linearGradient id="brasa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a6c5f"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Header -->
  <text x="80" y="100" fill="#f5ece1" font-size="50" font-weight="700" letter-spacing="-1.2">Etiya — serverless gym tracker</text>
  <text x="80" y="146" fill="#a8998a" font-size="24">React PWA · Java 21 on AWS Lambda · DynamoDB single table · Cognito · AWS CDK</text>
  <text x="1520" y="104" fill="#8a7d70" font-size="21" text-anchor="end">github.com/landoicco/etiya</text>
  <rect x="80" y="172" width="120" height="5" rx="2" fill="#f97316"/>

  <!-- Phone running the PWA: its home screen -->
  <rect x="90" y="290" width="180" height="330" rx="30" fill="#f6efe4" stroke="#4a3d33" stroke-width="4"/>
  <rect x="152" y="302" width="56" height="10" rx="5" fill="#2a2420"/>
  <text x="110" y="342" fill="#75695c" font-size="10">Good evening,</text>
  <text x="110" y="362" fill="#2a2420" font-size="18" font-weight="700">Lando</text>
  <circle cx="246" cy="350" r="11" fill="#fbe3cc"/>
  <rect x="106" y="378" width="148" height="96" rx="14" fill="url(#brasa)"/>
  <text x="118" y="398" fill="#2b1a0e" opacity="0.75" font-size="7" font-weight="700" letter-spacing="0.8">LAST WORKOUT</text>
  <text x="118" y="424" fill="#2b1a0e" font-size="20" font-weight="700">Push</text>
  <rect x="118" y="440" width="40" height="7" rx="3" fill="#2b1a0e" opacity="0.6"/>
  <rect x="168" y="440" width="22" height="7" rx="3" fill="#2b1a0e" opacity="0.6"/>
  <rect x="200" y="440" width="22" height="7" rx="3" fill="#2b1a0e" opacity="0.6"/>
  <rect x="106" y="484" width="148" height="56" rx="14" fill="#fffaf3" stroke="#eadfcd"/>
  <rect x="116" y="496" width="60" height="7" rx="3" fill="#2a2420"/>
  <rect x="106" y="511" width="148" height="1" fill="#eadfcd"/>
  <rect x="116" y="522" width="48" height="7" rx="3" fill="#2a2420"/>
  <rect x="106" y="562" width="148" height="40" rx="13" fill="url(#brasa)"/>
  <text x="180" y="587" fill="#2b1a0e" font-size="14" font-weight="700" text-anchor="middle">Start workout</text>
  <text x="180" y="662" fill="#f5ece1" font-size="22" font-weight="600" text-anchor="middle">PWA</text>
  <text x="180" y="690" fill="#a8998a" font-size="17" text-anchor="middle">installable,</text>
  <text x="180" y="712" fill="#a8998a" font-size="17" text-anchor="middle">opens offline</text>

  <!-- Phone -> CloudFront, API, Cognito -->
  <line x1="282" y1="330" x2="372" y2="272" stroke="#7a6c5f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="282" y1="455" x2="372" y2="455" stroke="#7a6c5f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="282" y1="580" x2="372" y2="636" stroke="#7a6c5f" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- CloudFront -> S3: the app itself -->
  <rect x="385" y="215" width="270" height="95" rx="18" fill="#211b17" stroke="#8B5CF6" stroke-width="2.5"/>
  <text x="520" y="256" fill="#f5ece1" font-size="25" font-weight="600" text-anchor="middle">CloudFront</text>
  <text x="520" y="288" fill="#C4B5FD" font-size="18" text-anchor="middle">HTTPS · cache rules</text>
  <line x1="665" y1="262" x2="778" y2="262" stroke="#7a6c5f" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="790" y="215" width="290" height="95" rx="18" fill="#211b17" stroke="#22C55E" stroke-width="2.5"/>
  <text x="935" y="256" fill="#f5ece1" font-size="25" font-weight="600" text-anchor="middle">S3, private</text>
  <text x="935" y="288" fill="#86EFAC" font-size="18" text-anchor="middle">app files, read via OAC</text>

  <!-- HTTP API -->
  <rect x="385" y="375" width="270" height="160" rx="18" fill="#211b17" stroke="#7C3AED" stroke-width="2.5"/>
  <text x="520" y="420" fill="#f5ece1" font-size="26" font-weight="600" text-anchor="middle">HTTP API</text>
  <text x="520" y="454" fill="#C4B5FD" font-size="19" text-anchor="middle">Cognito JWT authorizer</text>
  <text x="520" y="490" fill="#a8998a" font-size="17" text-anchor="middle">rejects 401 before</text>
  <text x="520" y="514" fill="#a8998a" font-size="17" text-anchor="middle">any code runs</text>

  <!-- Cognito -->
  <rect x="385" y="600" width="270" height="105" rx="18" fill="#211b17" stroke="#F43F5E" stroke-width="2.5"/>
  <text x="520" y="640" fill="#f5ece1" font-size="25" font-weight="600" text-anchor="middle">Cognito</text>
  <text x="520" y="670" fill="#FDA4AF" font-size="18" text-anchor="middle">SRP sign-in: the password</text>
  <text x="520" y="692" fill="#FDA4AF" font-size="18" text-anchor="middle">never leaves the phone</text>
  <line x1="520" y1="545" x2="520" y2="590" stroke="#7a6c5f" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)"/>

  <!-- API -> Lambdas -->
  <line x1="665" y1="420" x2="778" y2="382" stroke="#7a6c5f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="665" y1="455" x2="778" y2="455" stroke="#7a6c5f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="665" y1="490" x2="778" y2="528" stroke="#7a6c5f" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Lambdas, on the app's own gradient -->
  <rect x="790" y="345" width="290" height="70" rx="16" fill="url(#brasa)"/>
  <text x="935" y="377" fill="#2b1a0e" font-size="23" font-weight="700" text-anchor="middle">gymsApi</text>
  <text x="935" y="402" fill="#2b1a0e" opacity="0.8" font-size="17" text-anchor="middle">/gyms</text>
  <rect x="790" y="420" width="290" height="70" rx="16" fill="url(#brasa)"/>
  <text x="935" y="452" fill="#2b1a0e" font-size="23" font-weight="700" text-anchor="middle">exercisesApi</text>
  <text x="935" y="477" fill="#2b1a0e" opacity="0.8" font-size="17" text-anchor="middle">/exercises</text>
  <rect x="790" y="495" width="290" height="70" rx="16" fill="url(#brasa)"/>
  <text x="935" y="527" fill="#2b1a0e" font-size="23" font-weight="700" text-anchor="middle">workoutsApi</text>
  <text x="935" y="552" fill="#2b1a0e" opacity="0.8" font-size="17" text-anchor="middle">/me/workouts</text>
  <text x="935" y="600" fill="#fdac72" font-size="19" font-weight="700" text-anchor="middle">SnapStart · ~400 ms warm</text>

  <!-- Lambdas -> DynamoDB -->
  <line x1="1090" y1="382" x2="1198" y2="420" stroke="#7a6c5f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1090" y1="455" x2="1198" y2="455" stroke="#7a6c5f" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1090" y1="528" x2="1198" y2="490" stroke="#7a6c5f" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- DynamoDB -->
  <rect x="1210" y="375" width="300" height="160" rx="18" fill="#211b17" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="1360" y="420" fill="#f5ece1" font-size="26" font-weight="600" text-anchor="middle">DynamoDB</text>
  <text x="1360" y="454" fill="#93C5FD" font-size="19" text-anchor="middle">single table</text>
  <text x="1360" y="490" fill="#a8998a" font-size="16" text-anchor="middle">GYM# · EXERCISE#</text>
  <text x="1360" y="514" fill="#a8998a" font-size="16" text-anchor="middle">USER#id / WORKOUT#ulid</text>

  <!-- Retry-safe writes, next to the path they protect -->
  <rect x="1210" y="600" width="300" height="105" rx="18" fill="#211b17" stroke="#33291f" stroke-width="2"/>
  <text x="1360" y="638" fill="#f5ece1" font-size="20" font-weight="600" text-anchor="middle">Retry-safe writes</text>
  <text x="1360" y="666" fill="#a8998a" font-size="16" text-anchor="middle">the phone picks the ID, so a</text>
  <text x="1360" y="688" fill="#a8998a" font-size="16" text-anchor="middle">lost response never duplicates</text>

  <!-- Footer -->
  <rect x="80" y="752" width="1440" height="96" rx="18" fill="#191411" stroke="#2a221c" stroke-width="2"/>
  <text x="112" y="792" fill="#e9dccd" font-size="21">Same handlers run locally — a bridge builds the same API Gateway events, so one test suite covers both environments.</text>
  <text x="112" y="826" fill="#a8998a" font-size="21">ULID keys sort by start time · infrastructure in CDK, checked by cdk-nag · every decision documented · AWS free tier.</text>
</svg>
