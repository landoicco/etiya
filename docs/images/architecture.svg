<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c0a"/>
      <stop offset="100%" stop-color="#1d1713"/>
    </linearGradient>
    <linearGradient id="brasa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a6c5f"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>

  <!-- Header -->
  <text x="80" y="92" fill="#f5ece1" font-size="44" font-weight="700" letter-spacing="-1">Etiya on AWS — the EtiyaProd stack</text>
  <text x="80" y="132" fill="#a8998a" font-size="21">Five CDK constructs in us-east-1 · checked by cdk-nag on every synth · inside the AWS free tier</text>
  <text x="1520" y="94" fill="#8a7d70" font-size="21" text-anchor="end">github.com/landoicco/etiya</text>
  <rect x="80" y="152" width="120" height="5" rx="2" fill="#f97316"/>

  <!-- The stack's boundary -->
  <rect x="300" y="190" width="1240" height="770" rx="26" fill="none" stroke="#4a3d33" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="1512" y="220" fill="#8a7d70" font-size="16" text-anchor="end">EtiyaProd · CloudFormation stack</text>

  <!-- Phone, outside the stack -->
  <rect x="80" y="470" width="160" height="260" rx="28" fill="#f6efe4" stroke="#4a3d33" stroke-width="4"/>
  <rect x="135" y="482" width="50" height="9" rx="4.5" fill="#2a2420"/>
  <rect x="96" y="512" width="128" height="78" rx="12" fill="url(#brasa)"/>
  <rect x="96" y="602" width="128" height="22" rx="8" fill="#fffcf7" stroke="#e0d5c3"/>
  <rect x="96" y="632" width="128" height="22" rx="8" fill="#fffcf7" stroke="#e0d5c3"/>
  <rect x="96" y="682" width="128" height="30" rx="10" fill="url(#brasa)"/>
  <text x="160" y="768" fill="#f5ece1" font-size="22" font-weight="600" text-anchor="middle">Phone</text>
  <text x="160" y="794" fill="#a8998a" font-size="16" text-anchor="middle">installed PWA, offline</text>

  <!-- What the stack uses but does not own -->
  <text x="80" y="864" fill="#fb923c" font-size="13" font-weight="700" letter-spacing="1.6">OUTSIDE THE STACK</text>
  <text x="80" y="892" fill="#a8998a" font-size="15">licaza.dev hosted zone</text>
  <text x="80" y="916" fill="#a8998a" font-size="15">exercise art, a local folder</text>

  <!-- Web -->
  <rect x="330" y="240" width="1180" height="210" rx="20" fill="#16120f" stroke="#3a2f28" stroke-width="1.5"/>
  <text x="354" y="272" fill="#fb923c" font-size="14" font-weight="700" letter-spacing="1.8">WEB</text>

  <rect x="354" y="290" width="300" height="64" rx="14" fill="#211b17" stroke="#A78BFA" stroke-width="2"/>
  <text x="504" y="318" fill="#f5ece1" font-size="19" font-weight="600" text-anchor="middle">Route 53 A + AAAA</text>
  <text x="504" y="342" fill="#C4B5FD" font-size="15" text-anchor="middle">etiya.licaza.dev, alias records</text>

  <rect x="354" y="368" width="300" height="64" rx="14" fill="#211b17" stroke="#FBBF24" stroke-width="2"/>
  <text x="504" y="396" fill="#f5ece1" font-size="19" font-weight="600" text-anchor="middle">ACM certificate</text>
  <text x="504" y="420" fill="#FDE68A" font-size="15" text-anchor="middle">DNS-validated, renews itself</text>

  <rect x="720" y="290" width="360" height="142" rx="14" fill="#211b17" stroke="#8B5CF6" stroke-width="2"/>
  <text x="900" y="322" fill="#f5ece1" font-size="22" font-weight="600" text-anchor="middle">CloudFront</text>
  <text x="900" y="350" fill="#C4B5FD" font-size="15" text-anchor="middle">TLS 1.2 or later · HTTP to HTTPS</text>
  <text x="900" y="374" fill="#a8998a" font-size="15" text-anchor="middle">/assets/* cached for a year</text>
  <text x="900" y="397" fill="#a8998a" font-size="15" text-anchor="middle">everything else never cached</text>
  <text x="900" y="420" fill="#a8998a" font-size="15" text-anchor="middle">deep links fall back to index.html</text>

  <rect x="1150" y="290" width="336" height="142" rx="14" fill="#211b17" stroke="#22C55E" stroke-width="2"/>
  <text x="1318" y="322" fill="#f5ece1" font-size="22" font-weight="600" text-anchor="middle">S3 bucket</text>
  <text x="1318" y="350" fill="#86EFAC" font-size="15" text-anchor="middle">private, read only through OAC</text>
  <text x="1318" y="374" fill="#a8998a" font-size="15" text-anchor="middle">versioned, old versions kept 90 days</text>
  <text x="1318" y="397" fill="#a8998a" font-size="15" text-anchor="middle">the app build and the exercise art</text>
  <text x="1318" y="420" fill="#a8998a" font-size="15" text-anchor="middle">uploaded by scripts, not the stack</text>

  <!-- Api -->
  <rect x="330" y="480" width="330" height="250" rx="20" fill="#16120f" stroke="#3a2f28" stroke-width="1.5"/>
  <text x="354" y="512" fill="#fb923c" font-size="14" font-weight="700" letter-spacing="1.8">API</text>

  <rect x="354" y="530" width="282" height="178" rx="14" fill="#211b17" stroke="#7C3AED" stroke-width="2"/>
  <text x="495" y="566" fill="#f5ece1" font-size="22" font-weight="600" text-anchor="middle">HTTP API</text>
  <text x="495" y="596" fill="#C4B5FD" font-size="16" text-anchor="middle">Cognito JWT authorizer</text>
  <text x="495" y="622" fill="#a8998a" font-size="15" text-anchor="middle">401 before any Lambda runs</text>
  <text x="495" y="646" fill="#a8998a" font-size="15" text-anchor="middle">10 requests/s, bursts of 20</text>
  <text x="495" y="670" fill="#a8998a" font-size="15" text-anchor="middle">CORS for the app's origins</text>
  <text x="495" y="694" fill="#a8998a" font-size="15" text-anchor="middle">access logs, 14 days</text>

  <!-- Functions -->
  <rect x="690" y="480" width="450" height="250" rx="20" fill="#16120f" stroke="#3a2f28" stroke-width="1.5"/>
  <text x="714" y="512" fill="#fb923c" font-size="14" font-weight="700" letter-spacing="1.8">FUNCTIONS</text>

  <rect x="714" y="530" width="402" height="46" rx="12" fill="url(#brasa)"/>
  <text x="734" y="560" fill="#2b1a0e" font-size="19" font-weight="700">gymsApi</text>
  <text x="1096" y="560" fill="#2b1a0e" font-size="15" text-anchor="end">/gyms</text>
  <rect x="714" y="584" width="402" height="46" rx="12" fill="url(#brasa)"/>
  <text x="734" y="614" fill="#2b1a0e" font-size="19" font-weight="700">exercisesApi</text>
  <text x="1096" y="614" fill="#2b1a0e" font-size="15" text-anchor="end">/exercises · /catalog/exercises</text>
  <rect x="714" y="638" width="402" height="46" rx="12" fill="url(#brasa)"/>
  <text x="734" y="668" fill="#2b1a0e" font-size="19" font-weight="700">workoutsApi</text>
  <text x="1096" y="668" fill="#2b1a0e" font-size="15" text-anchor="end">/me/workouts</text>
  <text x="915" y="712" fill="#fdba74" font-size="15" font-weight="600" text-anchor="middle">Java 21 · 1 GB · SnapStart · one jar · live alias</text>

  <!-- Database -->
  <rect x="1170" y="480" width="340" height="250" rx="20" fill="#16120f" stroke="#3a2f28" stroke-width="1.5"/>
  <text x="1194" y="512" fill="#fb923c" font-size="14" font-weight="700" letter-spacing="1.8">DATABASE</text>

  <rect x="1194" y="530" width="292" height="178" rx="14" fill="#211b17" stroke="#3B82F6" stroke-width="2"/>
  <text x="1340" y="566" fill="#f5ece1" font-size="22" font-weight="600" text-anchor="middle">DynamoDB</text>
  <text x="1340" y="596" fill="#93C5FD" font-size="16" text-anchor="middle">EtiyaProd-Workouts</text>
  <text x="1340" y="622" fill="#a8998a" font-size="15" text-anchor="middle">one table, PK + SK</text>
  <text x="1340" y="646" fill="#a8998a" font-size="15" text-anchor="middle">provisioned, 5 reads / 5 writes</text>
  <text x="1340" y="670" fill="#a8998a" font-size="15" text-anchor="middle">point-in-time recovery</text>
  <text x="1340" y="694" fill="#a8998a" font-size="15" text-anchor="middle">deletion protection, retained</text>

  <!-- Auth -->
  <rect x="330" y="770" width="330" height="170" rx="20" fill="#16120f" stroke="#3a2f28" stroke-width="1.5"/>
  <text x="354" y="802" fill="#fb923c" font-size="14" font-weight="700" letter-spacing="1.8">AUTH</text>

  <rect x="354" y="818" width="282" height="64" rx="14" fill="#211b17" stroke="#F43F5E" stroke-width="2"/>
  <text x="495" y="845" fill="#f5ece1" font-size="19" font-weight="600" text-anchor="middle">Cognito user pool</text>
  <text x="495" y="869" fill="#FDA4AF" font-size="15" text-anchor="middle">invitation only · admins group</text>
  <rect x="354" y="892" width="282" height="36" rx="12" fill="#211b17" stroke="#F43F5E" stroke-width="1.5"/>
  <text x="495" y="916" fill="#FDA4AF" font-size="15" text-anchor="middle">app client · SRP, no secret</text>


  <!-- Outputs -->
  <rect x="690" y="770" width="820" height="170" rx="20" fill="#16120f" stroke="#3a2f28" stroke-width="1.5"/>
  <text x="714" y="802" fill="#fb923c" font-size="14" font-weight="700" letter-spacing="1.8">OUTPUTS</text>
  <text x="714" y="840" fill="#f5ece1" font-size="17">WebUrl · WebBucketName · ApiUrl · UserPoolId · UserPoolClientId · TableName</text>
  <text x="714" y="872" fill="#a8998a" font-size="15">Read by the deploy scripts and the catalog seed. The app gets the API URL and</text>
  <text x="714" y="896" fill="#a8998a" font-size="15">the Cognito ids at runtime, from a config.json written next to the build.</text>
  <text x="714" y="920" fill="#a8998a" font-size="15">The domain comes from infra/cdk.json; without it, the app is served on cloudfront.net.</text>

  <!-- Connectors, drawn last so no box covers their arrowheads -->
  <g stroke="#7a6c5f" stroke-width="3" marker-end="url(#arrow)">
    <!-- Phone -> the three things it talks to -->
    <line x1="250" y1="530" x2="344" y2="330"/>
    <line x1="250" y1="600" x2="344" y2="600"/>
    <line x1="250" y1="670" x2="344" y2="840"/>
    <!-- Web -->
    <line x1="660" y1="322" x2="710" y2="338"/>
    <line x1="1086" y1="361" x2="1140" y2="361"/>
    <!-- API -> Lambdas -> table -->
    <line x1="642" y1="600" x2="704" y2="555"/>
    <line x1="642" y1="607" x2="704" y2="607"/>
    <line x1="642" y1="614" x2="704" y2="659"/>
    <line x1="1122" y1="553" x2="1184" y2="600"/>
    <line x1="1122" y1="607" x2="1184" y2="613"/>
    <line x1="1122" y1="661" x2="1184" y2="626"/>
  </g>
  <g stroke="#7a6c5f" stroke-width="2.5" stroke-dasharray="6 6" marker-end="url(#arrow)">
    <!-- The certificate is attached, not called -->
    <line x1="660" y1="400" x2="710" y2="386"/>
    <!-- The authorizer checks tokens against the pool -->
    <line x1="600" y1="812" x2="600" y2="716"/>
  </g>
  <text x="590" y="756" fill="#8a7d70" font-size="13" text-anchor="end">validates tokens</text>
</svg>
