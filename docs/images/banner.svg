<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 400" width="1600" height="400" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c0a"/>
      <stop offset="100%" stop-color="#1d1713"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brasa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1600" height="400" rx="24"/></clipPath>

    <!-- The barbell of web/public/icon.svg, on its 512 grid -->
    <g id="barbell">
      <rect x="92" y="243" width="328" height="26" rx="13"/>
      <rect x="134" y="164" width="44" height="184" rx="16"/>
      <rect x="186" y="198" width="28" height="116" rx="12"/>
      <rect x="334" y="164" width="44" height="184" rx="16"/>
      <rect x="298" y="198" width="28" height="116" rx="12"/>
    </g>

    <!-- The tops of the home (light) and workout (dark) screens of showcase.svg -->
    <g id="home">
      <rect width="308" height="658" rx="41" fill="#f6efe4"/>
      <rect x="114" y="14" width="80" height="20" rx="10" fill="#000"/>
      <text x="24" y="82" fill="#75695c" font-size="14">Good evening,</text>
      <text x="24" y="116" fill="#2a2420" font-size="32" font-weight="700" letter-spacing="-0.8">Lando</text>
      <circle cx="262" cy="92" r="21" fill="#fbe3cc"/>
      <text x="262" y="99" fill="#b6400a" font-size="17" font-weight="700" text-anchor="middle">L</text>
      <rect x="18" y="142" width="272" height="178" rx="22" fill="url(#brasa)"/>
      <use xlink:href="#barbell" fill="#2b1a0e" opacity="0.13" transform="translate(178 126) scale(0.26)"/>
      <text x="36" y="174" fill="#2b1a0e" opacity="0.75" font-size="11" font-weight="700" letter-spacing="1.2">LAST WORKOUT</text>
      <text x="36" y="218" fill="#2b1a0e" font-size="36" font-weight="700" letter-spacing="-0.9">Push</text>
      <text x="36" y="240" fill="#2b1a0e" opacity="0.85" font-size="13">Tuesday, 3 days ago</text>
      <g fill="#2b1a0e" opacity="0.9">
        <text x="36" y="282" font-size="18" font-weight="700">1 h 12 min</text>
        <text x="36" y="300" font-size="11">time</text>
        <text x="150" y="282" font-size="18" font-weight="700">6</text>
        <text x="150" y="300" font-size="11">exercises</text>
        <text x="226" y="282" font-size="18" font-weight="700">22</text>
        <text x="226" y="300" font-size="11">sets</text>
      </g>
      <rect x="18" y="338" width="272" height="122" rx="22" fill="#fffaf3" stroke="#eadfcd" stroke-width="1.5"/>
      <rect x="34" y="354" width="34" height="34" rx="12" fill="#fbe3cc"/>
      <text x="82" y="377" fill="#2a2420" font-size="15" font-weight="600">History</text>
    </g>

    <g id="workout">
      <rect width="308" height="658" rx="41" fill="#16120f"/>
      <rect x="114" y="14" width="80" height="20" rx="10" fill="#000"/>
      <text x="22" y="92" fill="#f5ece1" font-size="38" font-weight="700" letter-spacing="-1">47:12</text>
      <text x="22" y="116" fill="#a8998a" font-size="13">Smart Fit · Centro</text>
      <rect x="208" y="64" width="80" height="40" rx="18" fill="none" stroke="#fdac72" stroke-width="1.5"/>
      <text x="248" y="89" fill="#fdac72" font-size="14" font-weight="700" text-anchor="middle">Finish</text>
      <rect x="18" y="136" width="272" height="82" rx="22" fill="#211b17" stroke="#33291f" stroke-width="1.5"/>
      <text x="34" y="164" fill="#f5ece1" font-size="15" font-weight="700">Barbell Bench Press</text>
      <g font-size="12" font-weight="600">
        <rect x="34" y="178" width="72" height="22" rx="11" fill="#3a2616"/>
        <text x="70" y="193" fill="#fdac72" text-anchor="middle">8 × 60 kg</text>
        <rect x="112" y="178" width="72" height="22" rx="11" fill="#3a2616"/>
        <text x="148" y="193" fill="#fdac72" text-anchor="middle">8 × 60 kg</text>
        <rect x="190" y="178" width="72" height="22" rx="11" fill="#3a2616"/>
        <text x="226" y="193" fill="#fdac72" text-anchor="middle">6 × 65 kg</text>
      </g>
      <rect x="18" y="228" width="272" height="82" rx="22" fill="#211b17" stroke="#fdac72" stroke-width="2.5"/>
      <text x="34" y="256" fill="#f5ece1" font-size="15" font-weight="700">Incline Dumbbell Press</text>
      <rect x="34" y="270" width="78" height="22" rx="11" fill="#3a2616"/>
      <text x="73" y="285" fill="#fdac72" font-size="12" font-weight="600" text-anchor="middle">10 × 22 kg</text>
      <rect x="18" y="322" width="272" height="48" rx="22" fill="none" stroke="#33291f" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text x="154" y="351" fill="#a8998a" font-size="14" font-weight="600" text-anchor="middle">+ Add exercise</text>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="400" fill="url(#bg)"/>
    <circle cx="1230" cy="300" r="420" fill="url(#glow)"/>

    <!-- Left: icon, name, promise -->
    <g transform="translate(110 110)">
      <rect width="180" height="180" rx="44" fill="url(#brasa)"/>
      <use xlink:href="#barbell" fill="#2b1a0e" transform="scale(0.3516)"/>
    </g>
    <text x="336" y="222" fill="#f5ece1" font-size="112" font-weight="700" letter-spacing="-3.5">Etiya</text>
    <text x="340" y="276" fill="#a8998a" font-size="30" letter-spacing="-0.3">Log your workouts, one set at a time.</text>

    <!-- Right: the tops of two phones, cut by the banner's edge -->
    <g transform="translate(1000 70) rotate(-6) scale(0.72)">
      <rect width="330" height="680" rx="50" fill="#2a221c"/>
      <use xlink:href="#workout" transform="translate(11 11)"/>
    </g>
    <g transform="translate(1250 46) rotate(5) scale(0.72)">
      <rect width="330" height="680" rx="50" fill="#3a302a"/>
      <use xlink:href="#home" transform="translate(11 11)"/>
    </g>
  </g>
</svg>
