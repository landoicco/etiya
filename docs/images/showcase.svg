<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="DejaVu Sans, Liberation Sans, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07090d"/>
      <stop offset="100%" stop-color="#111722"/>
    </linearGradient>
    <!-- The app's accent, glowing behind the phones -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.09"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="24" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1200" cy="460" r="520" fill="url(#glow)"/>

  <!-- Left: name, promise, stack -->
  <g transform="translate(110 210)">
    <!-- The app icon: a loaded barbell -->
    <rect width="96" height="96" rx="24" fill="#0b0f14" stroke="#2a323d" stroke-width="2"/>
    <rect x="18" y="45.75" width="60" height="4.5" rx="1.2" fill="#8b95a3"/>
    <rect x="25.5" y="33" width="6.75" height="30" rx="1.5" fill="#f97316"/>
    <rect x="33" y="38.25" width="4.5" height="19.5" rx="1.1" fill="#f97316"/>
    <rect x="63.75" y="33" width="6.75" height="30" rx="1.5" fill="#f97316"/>
    <rect x="58.5" y="38.25" width="4.5" height="19.5" rx="1.1" fill="#f97316"/>
  </g>
  <text x="104" y="420" fill="#F8FAFC" font-size="104" font-weight="700" letter-spacing="-2">Etiya</text>
  <text x="110" y="484" fill="#E2E8F0" font-size="36">Log your workouts, one set at a time.</text>
  <text x="110" y="542" fill="#8b95a3" font-size="23">A progressive web app built for the gym floor:</text>
  <text x="110" y="574" fill="#8b95a3" font-size="23">one hand, between sets, even without signal.</text>

  <g font-size="19" fill="#CBD5E1">
    <rect x="110" y="624" width="142" height="44" rx="22" fill="#151b23" stroke="#2a323d" stroke-width="1.5"/>
    <text x="181" y="653" text-anchor="middle">React PWA</text>
    <rect x="264" y="624" width="148" height="44" rx="22" fill="#151b23" stroke="#2a323d" stroke-width="1.5"/>
    <text x="338" y="653" text-anchor="middle">AWS Lambda</text>
    <rect x="424" y="624" width="132" height="44" rx="22" fill="#151b23" stroke="#2a323d" stroke-width="1.5"/>
    <text x="490" y="653" text-anchor="middle">DynamoDB</text>
    <rect x="568" y="624" width="116" height="44" rx="22" fill="#151b23" stroke="#2a323d" stroke-width="1.5"/>
    <text x="626" y="653" text-anchor="middle">Cognito</text>
    <rect x="696" y="624" width="116" height="44" rx="22" fill="#151b23" stroke="#2a323d" stroke-width="1.5"/>
    <text x="754" y="653" text-anchor="middle">AWS CDK</text>
  </g>
  <rect x="110" y="740" width="80" height="5" rx="2" fill="#f97316"/>
  <text x="110" y="782" fill="#64748B" font-size="20">github.com/landoicco/etiya</text>

  <!-- Back phone: the sign-in screen -->
  <g transform="rotate(-8 1040 470)" opacity="0.75" filter="url(#shadow)">
    <rect x="895" y="170" width="290" height="600" rx="44" fill="#1f2630"/>
    <rect x="905" y="180" width="270" height="580" rx="36" fill="#0b0f14"/>
    <rect x="1005" y="194" width="70" height="18" rx="9" fill="#000"/>
    <text x="929" y="270" fill="#F8FAFC" font-size="30" font-weight="700">Etiya</text>
    <text x="929" y="298" fill="#8b95a3" font-size="14">Sign in to log your workouts.</text>
    <text x="929" y="346" fill="#8b95a3" font-size="13">Email</text>
    <rect x="929" y="356" width="222" height="48" rx="12" fill="#151b23" stroke="#f97316" stroke-width="1.5"/>
    <text x="945" y="386" fill="#E2E8F0" font-size="15">you@example.com</text>
    <text x="929" y="432" fill="#8b95a3" font-size="13">Password</text>
    <rect x="929" y="442" width="222" height="48" rx="12" fill="#151b23" stroke="#2a323d" stroke-width="1.5"/>
    <text x="945" y="473" fill="#E2E8F0" font-size="18" letter-spacing="3">••••••••••</text>
    <rect x="929" y="680" width="222" height="54" rx="16" fill="url(#accent)"/>
    <text x="1040" y="714" fill="#0b0f14" font-size="18" font-weight="700" text-anchor="middle">Sign in</text>
  </g>

  <!-- Front phone: the home screen -->
  <g transform="rotate(5 1290 470)" filter="url(#shadow)">
    <rect x="1125" y="130" width="330" height="680" rx="50" fill="#262e39"/>
    <rect x="1136" y="141" width="308" height="658" rx="41" fill="#0b0f14"/>
    <rect x="1250" y="156" width="80" height="20" rx="10" fill="#000"/>

    <text x="1162" y="236" fill="#F8FAFC" font-size="32" font-weight="700">Etiya</text>
    <text x="1162" y="262" fill="#8b95a3" font-size="14">you@example.com</text>
    <text x="1418" y="222" fill="#8b95a3" font-size="13" text-anchor="end">Sign out</text>

    <text x="1162" y="310" fill="#8b95a3" font-size="14" font-weight="700">Recent workouts</text>

    <rect x="1162" y="324" width="256" height="72" rx="16" fill="#151b23" stroke="#2a323d" stroke-width="1.5"/>
    <text x="1178" y="354" fill="#F8FAFC" font-size="16" font-weight="700">Fri, Sep 18, 6:30 PM</text>
    <text x="1178" y="378" fill="#8b95a3" font-size="13">City Gym · 72 min · 5 exercises</text>

    <rect x="1162" y="406" width="256" height="72" rx="16" fill="#151b23" stroke="#2a323d" stroke-width="1.5"/>
    <text x="1178" y="436" fill="#F8FAFC" font-size="16" font-weight="700">Wed, Sep 16, 7:05 AM</text>
    <text x="1178" y="460" fill="#8b95a3" font-size="13">City Gym · 58 min · 4 exercises</text>

    <rect x="1162" y="488" width="256" height="72" rx="16" fill="#151b23" stroke="#2a323d" stroke-width="1.5"/>
    <text x="1178" y="518" fill="#F8FAFC" font-size="16" font-weight="700">Mon, Sep 14, 10:15 AM</text>
    <text x="1178" y="542" fill="#8b95a3" font-size="13">Home · 45 min · 3 exercises</text>

    <rect x="1162" y="570" width="256" height="72" rx="16" fill="#151b23" stroke="#2a323d" stroke-width="1.5"/>
    <text x="1178" y="600" fill="#F8FAFC" font-size="16" font-weight="700">Sat, Sep 12, 6:40 PM</text>
    <text x="1178" y="624" fill="#8b95a3" font-size="13">North Gym · 80 min · 6 exercises</text>

    <rect x="1162" y="714" width="256" height="60" rx="18" fill="url(#accent)"/>
    <text x="1290" y="751" fill="#0b0f14" font-size="19" font-weight="700" text-anchor="middle">Start workout</text>
  </g>
</svg>
