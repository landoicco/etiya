<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 900" width="1600" height="900" font-family="Inter, DejaVu Sans, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c0a"/>
      <stop offset="100%" stop-color="#1d1713"/>
    </linearGradient>
    <!-- The app's accent, glowing behind the phones -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.40"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brasa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="24" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.6"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- The barbell of web/public/icon.svg, on its 512 grid -->
    <g id="barbell">
      <rect x="92" y="243" width="328" height="26" rx="13"/>
      <rect x="134" y="164" width="44" height="184" rx="16"/>
      <rect x="186" y="198" width="28" height="116" rx="12"/>
      <rect x="334" y="164" width="44" height="184" rx="16"/>
      <rect x="298" y="198" width="28" height="116" rx="12"/>
    </g>

    <!-- Home, light: a 308 x 658 screen -->
    <g id="home">
      <rect width="308" height="658" rx="41" fill="#f6efe4"/>
      <rect x="114" y="14" width="80" height="20" rx="10" fill="#000"/>
      <text x="24" y="82" fill="#75695c" font-size="14">Good evening,</text>
      <text x="24" y="116" fill="#2a2420" font-size="32" font-weight="700" letter-spacing="-0.8">Lando</text>
      <circle cx="262" cy="92" r="21" fill="#fbe3cc"/>
      <text x="262" y="99" fill="#b6400a" font-size="17" font-weight="700" text-anchor="middle">L</text>

      <rect x="18" y="142" width="272" height="178" rx="22" fill="url(#brasa)"/>
      <use xlink:href="#barbell" fill="#2b1a0e" opacity="0.13" transform="translate(178 126) scale(0.26)"/>
      <text x="36" y="174" fill="#2b1a0e" opacity="0.75" font-size="11" font-weight="700" letter-spacing="1.2">LAST WORKOUT</text>
      <text x="36" y="218" fill="#2b1a0e" font-size="36" font-weight="700" letter-spacing="-0.9">Push</text>
      <text x="36" y="240" fill="#2b1a0e" opacity="0.85" font-size="13">Tuesday, 3 days ago</text>
      <g fill="#2b1a0e" opacity="0.9">
        <text x="36" y="282" font-size="18" font-weight="700">1 h 12 min</text>
        <text x="36" y="300" font-size="11">time</text>
        <text x="150" y="282" font-size="18" font-weight="700">6</text>
        <text x="150" y="300" font-size="11">exercises</text>
        <text x="226" y="282" font-size="18" font-weight="700">22</text>
        <text x="226" y="300" font-size="11">sets</text>
      </g>

      <rect x="18" y="338" width="272" height="122" rx="22" fill="#fffaf3" stroke="#eadfcd" stroke-width="1.5"/>
      <rect x="34" y="354" width="34" height="34" rx="12" fill="#fbe3cc"/>
      <path d="M43 371a8 8 0 1 0 2.7-6l-2.7 2.4M43 362.5v4.5h4.5M51 366.5v4.5l2.7 1.8" fill="none" stroke="#b6400a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="377" fill="#2a2420" font-size="15" font-weight="600">History</text>
      <text x="272" y="377" fill="#75695c" font-size="16" text-anchor="end">›</text>
      <rect x="18" y="399" width="272" height="1.5" fill="#eadfcd"/>
      <rect x="34" y="412" width="34" height="34" rx="12" fill="#fbe3cc"/>
      <circle cx="51" cy="429" r="8" fill="none" stroke="#b6400a" stroke-width="1.8"/>
      <path d="M51 428v4.5M51 425h.01" stroke="#b6400a" stroke-width="1.8" stroke-linecap="round"/>
      <text x="82" y="435" fill="#2a2420" font-size="15" font-weight="600">About</text>
      <text x="272" y="435" fill="#75695c" font-size="16" text-anchor="end">›</text>

      <rect x="18" y="572" width="272" height="60" rx="18" fill="url(#brasa)"/>
      <path d="M84 592v20l15-10z" fill="#2b1a0e"/>
      <text x="172" y="608" fill="#2b1a0e" font-size="18" font-weight="700" text-anchor="middle">Start workout</text>
    </g>

    <!-- Workout, dark: a 308 x 658 screen -->
    <g id="workout">
      <rect width="308" height="658" rx="41" fill="#16120f"/>
      <rect x="114" y="14" width="80" height="20" rx="10" fill="#000"/>
      <text x="22" y="92" fill="#f5ece1" font-size="38" font-weight="700" letter-spacing="-1">47:12</text>
      <text x="22" y="116" fill="#a8998a" font-size="13">Smart Fit · Centro</text>
      <rect x="208" y="64" width="80" height="40" rx="18" fill="none" stroke="#fdac72" stroke-width="1.5"/>
      <text x="248" y="89" fill="#fdac72" font-size="14" font-weight="700" text-anchor="middle">Finish</text>

      <rect x="18" y="136" width="272" height="82" rx="22" fill="#211b17" stroke="#33291f" stroke-width="1.5"/>
      <text x="34" y="164" fill="#f5ece1" font-size="15" font-weight="700">Barbell Bench Press</text>
      <g font-size="12" font-weight="600">
        <rect x="34" y="178" width="72" height="22" rx="11" fill="#3a2616"/>
        <text x="70" y="193" fill="#fdac72" text-anchor="middle">8 × 60 kg</text>
        <rect x="112" y="178" width="72" height="22" rx="11" fill="#3a2616"/>
        <text x="148" y="193" fill="#fdac72" text-anchor="middle">8 × 60 kg</text>
        <rect x="190" y="178" width="72" height="22" rx="11" fill="#3a2616"/>
        <text x="226" y="193" fill="#fdac72" text-anchor="middle">6 × 65 kg</text>
      </g>

      <rect x="18" y="228" width="272" height="82" rx="22" fill="#211b17" stroke="#fdac72" stroke-width="2.5"/>
      <text x="34" y="256" fill="#f5ece1" font-size="15" font-weight="700">Incline Dumbbell Press</text>
      <rect x="34" y="270" width="78" height="22" rx="11" fill="#3a2616"/>
      <text x="73" y="285" fill="#fdac72" font-size="12" font-weight="600" text-anchor="middle">10 × 22 kg</text>

      <rect x="18" y="322" width="272" height="48" rx="22" fill="none" stroke="#33291f" stroke-width="1.5" stroke-dasharray="6 5"/>
      <text x="154" y="351" fill="#a8998a" font-size="14" font-weight="600" text-anchor="middle">+ Add exercise</text>

      <path d="M0 434a26 26 0 0 1 26-26h256a26 26 0 0 1 26 26v183a41 41 0 0 1-41 41H41a41 41 0 0 1-41-41z" fill="#211b17"/>
      <rect x="0" y="408" width="308" height="1.5" fill="#33291f" opacity="0.6"/>
      <text x="22" y="440" fill="#f5ece1" font-size="14" font-weight="700">Incline Dumbbell Press</text>
      <text x="22" y="458" fill="#a8998a" font-size="12">Set 2</text>
      <rect x="206" y="424" width="82" height="34" rx="16" fill="none" stroke="#33291f" stroke-width="1.5"/>
      <text x="247" y="446" fill="#a8998a" font-size="12" font-weight="600" text-anchor="middle">Undo set</text>

      <g fill="#a8998a" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">
        <text x="84" y="488">REPS</text>
        <text x="224" y="488">KG</text>
      </g>
      <g fill="none" stroke="#33291f" stroke-width="1.5">
        <rect x="22" y="498" width="40" height="46" rx="14"/>
        <rect x="106" y="498" width="40" height="46" rx="14"/>
        <rect x="162" y="498" width="40" height="46" rx="14"/>
        <rect x="246" y="498" width="40" height="46" rx="14"/>
      </g>
      <g fill="#f5ece1" font-size="22" text-anchor="middle">
        <text x="42" y="528">−</text><text x="126" y="528">+</text>
        <text x="182" y="528">−</text><text x="266" y="528">+</text>
      </g>
      <g fill="#f5ece1" font-size="30" font-weight="700" text-anchor="middle">
        <text x="84" y="532">10</text>
        <text x="224" y="532">22</text>
      </g>

      <rect x="18" y="556" width="272" height="40" rx="18" fill="#16120f" stroke="#33291f" stroke-width="1.5"/>
      <rect x="22" y="560" width="86" height="32" rx="14" fill="#211b17"/>
      <g font-size="13" font-weight="700" text-anchor="middle">
        <text x="65" y="581" fill="#f5ece1">kg</text>
        <text x="154" y="581" fill="#a8998a">lb</text>
        <text x="243" y="581" fill="#a8998a">reps</text>
      </g>
      <rect x="18" y="606" width="272" height="44" rx="18" fill="url(#brasa)"/>
      <path d="M118 628.5l4.5 4.5 9.5-9.5" fill="none" stroke="#1f1209" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="170" y="634" fill="#1f1209" font-size="16" font-weight="700" text-anchor="middle">Log set</text>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1200" cy="460" r="520" fill="url(#glow)"/>

  <!-- Left: icon, name, promise, stack -->
  <g transform="translate(110 200)">
    <rect width="104" height="104" rx="26" fill="url(#brasa)"/>
    <use xlink:href="#barbell" fill="#2b1a0e" transform="scale(0.203)"/>
  </g>
  <text x="104" y="420" fill="#f5ece1" font-size="104" font-weight="700" letter-spacing="-3">Etiya</text>
  <text x="110" y="484" fill="#f5ece1" font-size="36" letter-spacing="-0.5">Log your workouts, one set at a time.</text>
  <text x="110" y="542" fill="#a8998a" font-size="23">A progressive web app built for the gym floor:</text>
  <text x="110" y="574" fill="#a8998a" font-size="23">one hand, between sets, even without signal.</text>

  <g font-size="19" fill="#e9dccd" text-anchor="middle">
    <rect x="110" y="624" width="142" height="44" rx="22" fill="#211b17" stroke="#33291f" stroke-width="1.5"/>
    <text x="181" y="652">React PWA</text>
    <rect x="264" y="624" width="148" height="44" rx="22" fill="#211b17" stroke="#33291f" stroke-width="1.5"/>
    <text x="338" y="652">AWS Lambda</text>
    <rect x="424" y="624" width="132" height="44" rx="22" fill="#211b17" stroke="#33291f" stroke-width="1.5"/>
    <text x="490" y="652">DynamoDB</text>
    <rect x="568" y="624" width="116" height="44" rx="22" fill="#211b17" stroke="#33291f" stroke-width="1.5"/>
    <text x="626" y="652">Cognito</text>
    <rect x="696" y="624" width="116" height="44" rx="22" fill="#211b17" stroke="#33291f" stroke-width="1.5"/>
    <text x="754" y="652">AWS CDK</text>
  </g>
  <rect x="110" y="740" width="80" height="5" rx="2" fill="#f97316"/>
  <text x="110" y="782" fill="#8a7d70" font-size="20">github.com/landoicco/etiya</text>

  <!-- Back phone: a workout, dark -->
  <g transform="rotate(-8 1040 470)" filter="url(#shadow)">
    <rect x="875" y="130" width="330" height="680" rx="50" fill="#2a221c"/>
    <use xlink:href="#workout" transform="translate(886 141)"/>
  </g>

  <!-- Front phone: home, light -->
  <g transform="rotate(5 1310 470)" filter="url(#shadow)">
    <rect x="1145" y="130" width="330" height="680" rx="50" fill="#3a302a"/>
    <use xlink:href="#home" transform="translate(1156 141)"/>
  </g>
</svg>
