<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the layout reach behind the notch; the CSS pads it with safe areas -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="Log your workouts, one set at a time" />
    <!-- The phone's bar takes the app's background, light or dark. Must match --color-surface -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6efe4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16120f" />
    <!-- iOS: a solid bar with dark text; black-translucent forced white text over the light app -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Etiya</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
