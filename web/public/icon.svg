<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- A loaded barbell on the app's gradient. Kept inside the central safe zone,
       so maskable icons can crop it into a circle or a squircle -->
  <defs>
    <linearGradient id="brasa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#brasa)"/>
  <g fill="#2b1a0e">
    <rect x="92" y="243" width="328" height="26" rx="13"/>
    <rect x="134" y="164" width="44" height="184" rx="16"/>
    <rect x="186" y="198" width="28" height="116" rx="12"/>
    <rect x="334" y="164" width="44" height="184" rx="16"/>
    <rect x="298" y="198" width="28" height="116" rx="12"/>
  </g>
</svg>
